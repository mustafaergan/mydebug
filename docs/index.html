<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyDebug HotReload</title>
<meta name="description" content="IntelliJ IDEA için kaydedince çalışan Java uygulamasına anında yükleme: Spring, MyBatis, Run ve Debug.">
<style>
  :root { --bg: #15171c; --fg: #eef0f3; --muted: #a6acb6; --accent: #ff7a00; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: clamp(26px, 4vw, 38px); }
  h1::before { content: ""; display: block; width: 64px; height: 5px; background: var(--accent); margin-bottom: 16px; }
  p { margin: 0 0 20px; color: var(--muted); }
  video { width: 100%; height: auto; border-radius: 10px; background: #000; display: block; }
  nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
  a { color: var(--fg); text-decoration: none; padding: 10px 16px; border-radius: 8px; border: 1px solid #3a3f48; }
  a.primary { background: var(--accent); border-color: var(--accent); color: #15171c; font-weight: 600; }
  a:hover { border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>MyDebug HotReload</h1>
  <p>Kaydet → çalışan Java uygulamasında anında gör. Yeniden başlatma yok. Kurulum ve kullanım (1:38).</p>
  <video controls preload="metadata" poster="poster.jpg" playsinline>
    <source src="mydebug-setup-tr.mp4" type="video/mp4">
  </video>
  <nav>
    <a class="primary" href="https://plugins.jetbrains.com/plugin/36412-mydebug-hotreload">JetBrains Marketplace'ten kur</a>
    <a href="https://github.com/mustafaergan/mydebug">Kaynak kod (GitHub)</a>
  </nav>
</main>
</body>
</html>
